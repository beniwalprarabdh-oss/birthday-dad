<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday Dad ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffe9b8);
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      width: 85%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    h1 {
      font-size: 38px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
    }

    .video {
      margin-top: 25px;
    }

    iframe {
      width: 100%;
      height: 315px;
      border: 0;
      border-radius: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎂 Happy Birthday Dad! ❤️</h1>

    <p>
      Happy Birthday to the best dad ever!<br>
      I made this special surprise just for you. ❤️
    </p>

    <div class="video">
      <iframe
        src="YOUR_YOUTUBE_EMBED_LINK"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</body>
</html>
